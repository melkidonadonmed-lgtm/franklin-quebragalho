[project]
name = "franklin-quebragalho"
version = "1.0.0"
description = "Franklin Quebra-Galho - Servidor MCP Global e Incubadora de Skills"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp==4.0.10",
    "mcp==2.2.0",
    "pyyaml>=6.0.0",
]

[project.scripts]
franklin-mcp = "server:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["server.py"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
