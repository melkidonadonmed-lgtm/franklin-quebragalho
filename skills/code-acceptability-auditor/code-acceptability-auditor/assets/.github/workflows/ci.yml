name: Code Acceptability Audit Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  ast-quality-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pydantic pytest

      - name: Run Code Acceptability Auditor
        run: |
          python scripts/code_acceptability_auditor.py --dir scripts --min-score 75.0

      - name: Run Trigger Evals & Unit Tests
        run: |
          python scripts/trigger_eval_runner.py
          pytest scripts/test_code_acceptability_auditor.py -v
